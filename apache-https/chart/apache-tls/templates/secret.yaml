{{- $secretName := printf "%s-tls" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $crt := "" }}
{{- $key := "" }}
{{- if $existing }}
{{- $crt = index $existing.data "tls.crt" }}
{{- $key = index $existing.data "tls.key" }}
{{- else }}
{{- $cert := genSelfSignedCert .Values.host nil (list .Values.host) 365 }}
{{- $crt = b64enc $cert.Cert }}
{{- $key = b64enc $cert.Key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
