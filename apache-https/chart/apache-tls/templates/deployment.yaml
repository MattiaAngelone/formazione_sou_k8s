apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: httpd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed -i \
                -e 's|^#\(LoadModule ssl_module .*\)$|\1|' \
                -e 's|^#\(LoadModule socache_shmcb_module .*\)$|\1|' \
                -e 's|^#\(Include conf/extra/httpd-ssl.conf\)$|\1|' \
                /usr/local/apache2/conf/httpd.conf
              exec httpd-foreground
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          volumeMounts:
            - name: tls
              mountPath: /usr/local/apache2/conf/tls
              readOnly: true
            - name: ssl-conf
              mountPath: /usr/local/apache2/conf/extra/httpd-ssl.conf
              subPath: httpd-ssl.conf
          readinessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Release.Name }}-tls
            defaultMode: 0400
        - name: ssl-conf
          configMap:
            name: {{ .Release.Name }}-ssl-conf
