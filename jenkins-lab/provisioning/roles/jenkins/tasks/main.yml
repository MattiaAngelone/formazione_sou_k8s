---
- name: carica le variabili cifrate del vault
  ansible.builtin.include_vars: vault.yml

- name: Crea la rete Docker per Jenkins
  community.docker.docker_network:
    name: jenkins-net
    driver: bridge
    ipam_config:
      - subnet: 172.20.0.0/16
        gateway: 172.20.0.1

- name: Crea il volume per la home di jenkins
  community.docker.docker_volume:
    name: jenkins_home

- name: Avvia il container Jenkins Master
  community.docker.docker_container:
    name: jenkins-master
    image: jenkins/jenkins:lts
    state: started
    restart_policy: unless-stopped  # riparte da solo dopo un riavvio
    networks:
      - name: jenkins-net
        ipv4_address: "{{ jenkins_master_ip }}"
    ports:
      - "8080:8080"    # porta 8080 -- interfaccia web; porta 50000 -- porta su cui si collegano gli agent
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

- name: crea la directory di build per l'agent
  ansible.builtin.file:
    path: /opt/agent-build
    state: directory
    mode: "0755"

- name: Copia il Dockerfile dell'agent
  ansible.builtin.copy:
    src: Dockerfile-agent
    dest: /opt/agent-build/Dockerfile

- name: Builda l'immagine Agent con il client Docker
  community.docker.docker_image:
    name: jenkins-agent-docker
    tag: latest
    source: build
    build:
      path: /opt/agent-build
    force_source: true
    state: present

- name: Avvia il container jenkins agent
  community.docker.docker_container:
    name: jenkins-agent
    image: jenkins-agent-docker:latest
    user: root
    state: started
    restart_policy: unless-stopped
    networks:
      - name: jenkins-net
        ipv4_address: "{{ jenkins_agent_ip }}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # montaggio del socket che permette al CLI dentro l'agent di comandare il motore docker della VM
    env:
      JENKINS_URL: "http://{{ jenkins_master_ip }}:8080"  # l'agent cerca l'indirizzo fisso del master per connettersi
      JENKINS_AGENT_NAME: "{{ jenkins_agent_name }}"
      JENKINS_SECRET: "{{ jenkins_agent_secret }}"
      JENKINS_AGENT_WORKDIR: "/home/jenkins/agent"
      JENKINS_WEB_SOCKET: "true"  # fa collegare l'agent via websocket sulla porta 8080
