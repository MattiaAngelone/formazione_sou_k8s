apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: httpd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed -i \
                -e 's|^Listen 80$|Listen {{ .Values.containerPorts.http }}|' \
                -e 's|^#\(LoadModule ssl_module .*\)$|\1|' \
                -e 's|^#\(LoadModule socache_shmcb_module .*\)$|\1|' \
                -e 's|^#\(Include conf/extra/httpd-ssl.conf\)$|\1|' \
                /usr/local/apache2/conf/httpd.conf
              exec httpd-foreground

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          ports:
            - name: http
              containerPort: {{ .Values.containerPorts.http }}
            - name: https
              containerPort: {{ .Values.containerPorts.https }}

          volumeMounts:
            - name: tls
              mountPath: /usr/local/apache2/conf/tls
              readOnly: true
            - name: ssl-conf
              mountPath: /usr/local/apache2/conf/extra/httpd-ssl.conf
              subPath: httpd-ssl.conf

          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 2
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: tls
          secret:
            secretName: {{ .Release.Name }}-tls
            defaultMode: 0400
        - name: ssl-conf
          configMap:
            name: {{ .Release.Name }}-ssl-conf
