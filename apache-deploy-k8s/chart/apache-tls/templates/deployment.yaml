apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/httpd-conf: {{ include (print $.Template.BasePath "/configmap-httpd.yaml") . | sha256sum }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: httpd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          ports:
            - name: http
              containerPort: {{ .Values.containerPorts.http }}
            - name: https
              containerPort: {{ .Values.containerPorts.https }}

          volumeMounts:
            - name: httpd-conf
              mountPath: /usr/local/apache2/conf/httpd.conf
              subPath: httpd.conf
              readOnly: true
            - name: ssl-conf
              mountPath: /usr/local/apache2/conf/extra/httpd-ssl.conf
              subPath: httpd-ssl.conf
              readOnly: true
            - name: tls
              mountPath: /usr/local/apache2/conf/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp

          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 2
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: httpd-conf
          configMap:
            name: {{ .Release.Name }}-conf
        - name: tls
          secret:
            secretName: {{ .Release.Name }}-tls
            defaultMode: 0440
        - name: ssl-conf
          configMap:
            name: {{ .Release.Name }}-ssl-conf
        - name: tmp
          emptyDir: {}
